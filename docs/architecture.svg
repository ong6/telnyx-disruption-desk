<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 968" width="1400" height="968" role="img" aria-labelledby="ttl dsc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="ttl">Disruption Desk architecture</title>
<desc id="dsc">A caller reaches a Telnyx AI Assistant whose workflow calls a dynamic-variables webhook, an MCP server owning four actors, and a reservation system mock; one W3C traceparent trace id links all three, and a Trip actor alarm places an outbound callback call.</desc>
<style>
:root{--bg:#fafaf9;--fg:#1f2933;--mut:#5f6b7a;--st:#6b7280;--gr:#9aa3af;--surf:#ffffff;--ac:#2563eb;--acs:#eff4ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e6e8eb;--mut:#a0a8b4;--st:#9aa3af;--gr:#6b7280;--surf:#171a21;--ac:#6ea8ff;--acs:#1a2336}}
.bg{fill:var(--bg)}
.node{fill:var(--surf);stroke:var(--st);stroke-width:1.25}
.act{fill:var(--acs);stroke:var(--ac);stroke-width:1.25}
.chip{fill:none;stroke:var(--gr);stroke-width:1}
.grp{fill:none;stroke:var(--gr);stroke-width:1.25;stroke-dasharray:6 4}
.t{font-size:13px;font-weight:600;fill:var(--fg)}
.s{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--mut)}
.l{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--fg)}
.la{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ac)}
.g{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.ln{fill:none;stroke:var(--st);stroke-width:1.25}
.dash{fill:none;stroke:var(--st);stroke-width:1.25;stroke-dasharray:3 4}
.tr{fill:none;stroke:var(--ac);stroke-width:1.75;stroke-dasharray:7 4}
.mk{fill:var(--st)}.mka{fill:var(--ac)}
.dot{fill:var(--st)}
</style>
