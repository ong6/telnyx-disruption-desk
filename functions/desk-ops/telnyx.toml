name = "desk-ops"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Owned here: the canary that proves the line works every minute.
[[actors]]
binding = "CANARY"
type = "Canary"

[[actors]]
binding = "SURGE"
type = "Surge"

# Shared actors owned by desk-mcp.
[[actors]]
binding = "FLIGHT"
type = "Flight"

[[actors]]
binding = "TRIP"
type = "Trip"

[[actors]]
binding = "METRICS"
type = "Metrics"

# Actor code runs outside the function process, so it reads secrets through the binding,
# not process.env.
[[secrets]]
binding = "ADMIN_TOKEN"
name = "DESK_ADMIN_TOKEN"

[storage.kv.KV]
id = "22a353f3-671d-4118-87f3-04ba6a1070aa"

[edge_compute]
func_id = "68bad318-0d81-4fe8-861f-6a803efb0d48"
func_name = "desk-ops"
